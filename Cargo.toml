[package]
name = "xlerobot-gravcomp"
description = "Gravity compensation for XLeRobot SO-101 arms (Feetech STS3215)"
license = "Apache-2.0"

version = "0.1.0"
edition = "2024"

[[bin]]
name = "gravcomp"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
nalgebra = "0.35.0"
rustypot = "1.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4.10.1"
toml = "1.2.2"
urdf-rs = "0.10.0"
